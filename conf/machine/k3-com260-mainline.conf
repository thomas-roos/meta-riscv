#@TYPE: Machine
#@NAME: K3 CoM260 (mainline kernel)
#@SOC: Spacemit K3
#@DESCRIPTION: #@DESCRIPTION: Machine configuration for carrier board with SpacemiT K3 CoM260 SoM using the mainline kernel

require conf/machine/include/k3.inc

KERNEL_DEVICETREE ?= "spacemit/k3-com260-ifx.dtb"

IMAGE_BOOT_FILES += " \
        k3-com260-ifx.dtb \
	"

# The UFS link on the CoM260 IFX (YMTC YMUS8B5TH1A1C1) is only stable in
# HS-G1 rate A on one lane so far; G3 x2 fails with DL/PA errors after the
# power mode change. Remove once the driver is fixed.
K3_EXTRA_BOOTARGS ?= "ufs_spacemit.hs_gear=1 ufs_spacemit.hs_rate=1 ufs_spacemit.lanes=1"
